# VDA5050 visualizer.
#
#   docker compose up
# or
#   docker compose up visualizer
#
# This package folder is bind-mounted at /app (relative paths are resolved
# from this file's folder); the container runs as the image's "node" user
# (uid 1000) so node_modules and saved-orders.json stay owned by the host user.
services:
  visualizer:
    image: node:24-bookworm
    container_name: vda5050_visualizer
    user: node
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8082:8082"
    environment:
      # Electron/Cypress binaries are only needed for the desktop build and e2e tests
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CYPRESS_INSTALL_BINARY: "0"
      # Browsers reach MQTT only over websockets: mosquitto listener 9001
      VITE_MQTT_HOST: localhost
      VITE_MQTT_PORT: "9001"
      VITE_VDA_INTERFACE: uagv
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
